version: '3'

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  PROFILE_DIR: '{{ if eq .PROFILE "release" }}release{{ else }}debug{{ end }}'
  BIN: glyphtrail
  PORT: '{{ .PORT | default "7700" }}'

tasks:
  # Lists all available tasks. Default entry point when running `task` with no arguments.
  default:
    cmds:
      - task --list --sort=none
    silent: true

  # Compiles all crates and targets in the workspace.
  # Override profile: `task build PROFILE=release`
  build:
    desc: Build the workspace (PROFILE=debug|release)
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo build --workspace --all-targets {{.PROFILE_FLAG}}

  # Shorthand for `task build PROFILE=release`.
  build:release:
    desc: Build the workspace in release mode
    cmds:
      - task: build
        vars: {PROFILE: release}

  # Runs the CLI binary via `cargo run`. Pass subcommands and flags after `--`.
  # Example: `task run -- analyze ./my-repo`
  run:
    desc: Run the Glyphtrail CLI (pass args after --)
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- {{.CLI_ARGS}}

  # Indexes a repository and writes the graph to `.glyphtrail/`.
  # Override target: `task analyze TARGET=/path/to/repo`
  analyze:
    desc: Analyze a repo path (defaults to current directory)
    vars:
      TARGET: '{{ .TARGET | default "." }}'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- analyze {{.TARGET}} {{.CLI_ARGS}}

  # Queries the graph index. Requires a prior `task analyze` run.
  # Example: `task query -- def main`
  query:
    desc: 'Query the graph (pass args after --, e.g. task query -- def main)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- query {{.CLI_ARGS}}

  # Outlines the symbols + signatures of a file or directory.
  # Example: `task outline -- src --detail full`
  outline:
    desc: 'Outline a file/dir''s symbols (pass args after --, e.g. task outline -- src)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- outline {{.CLI_ARGS}}

  # Computes the blast radius of a change. Requires a prior `task analyze`.
  # Example: `task impact -- Protocol` or `task impact -- --since main..HEAD`
  impact:
    desc: 'Blast radius of a change (pass args after --, e.g. task impact -- <name>)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- impact {{.CLI_ARGS}}

  # Runs a raw Cypher query against the graph.
  # Example: `task cypher -- 'MATCH (n) RETURN n.name LIMIT 5'`
  cypher:
    desc: 'Run a raw Cypher query (pass the query after --)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- cypher {{.CLI_ARGS}}

  # Starts the HTTP graph explorer. Override port: `task serve PORT=8080`
  serve:
    desc: Start the interactive graph explorer on PORT (default 7700)
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- serve --port {{.PORT}} {{.CLI_ARGS}}

  # Renders the graph as a single portable HTML file.
  # Override output path: `task viz OUT=out/graph.html`
  viz:
    desc: Generate a self-contained graph.html
    vars:
      OUT: '{{ .OUT | default "graph.html" }}'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- viz --output {{.OUT}} {{.CLI_ARGS}}

  # Prints node/edge counts and index metadata for the current `.glyphtrail/` index.
  status:
    desc: Show index statistics
    aliases:
      - stats
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- status {{.CLI_ARGS}}

  # Reports API contract drift between code endpoints and the blessed schema.
  # Requires a prior `task analyze` and a configured `[[api.schemas]]`.
  # Pass extra flags after `--`, e.g. `task drift -- --format json`.
  drift:
    desc: Report API drift (code endpoints vs blessed schema)
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- drift {{.CLI_ARGS}}

  # Drift check that exits non-zero (code 2) when the API surface has drifted.
  # Intended for CI pipelines guarding the code↔contract boundary.
  drift:gate:
    desc: Fail if API contract drift is found (CI gate)
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- drift --gate {{.CLI_ARGS}}

  # Generates a documentation wiki from the graph via an LLM.
  # Example: `task wiki -- --provider claude` or `task wiki -- --dry-run`
  wiki:
    desc: 'Generate a docs wiki via an LLM (pass args after --)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- wiki {{.CLI_ARGS}}

  # Narrates the repository's history from its git log via an LLM.
  # Example: `task story -- --provider claude`
  story:
    desc: 'Narrate repo history via an LLM (pass args after --)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- story {{.CLI_ARGS}}

  # Runs the Model Context Protocol server over stdio (for agents/editors).
  # Example: `task mcp -- --repo .`
  mcp:
    desc: 'Run the MCP server over stdio (pass args after --)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- mcp {{.CLI_ARGS}}

  # Onboards coding agents: writes skill + CLAUDE.md/AGENTS.md section + gitignore.
  # Example: `task setup -- .` or `task setup -- --home`
  setup:
    desc: 'Onboard coding agents (pass args after --)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- setup {{.CLI_ARGS}}

  # Manages the global repository registry (~/.glyphtrail/registry.json).
  # Example: `task repo -- list` or `task repo -- add .`
  repo:
    desc: 'Manage the repo registry (pass args after --, e.g. task repo -- list)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- repo {{.CLI_ARGS}}

  # Manages named groups of repositories (~/.glyphtrail/groups.json).
  # Example: `task group -- list`
  group:
    desc: 'Manage repo groups (pass args after --, e.g. task group -- list)'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- group {{.CLI_ARGS}}

  # Emits a shell completion script to stdout.
  # Override shell: `task completions SHELL_KIND=zsh`
  completions:
    desc: 'Generate a shell completion script (SHELL_KIND=bash|zsh|fish|powershell|elvish)'
    vars:
      SHELL_KIND: '{{ .SHELL_KIND | default "bash" }}'
    cmds:
      - cargo run -p glyphtrail-cli {{.PROFILE_FLAG}} -- completions {{.SHELL_KIND}}

  # Runs all unit and integration tests across the workspace.
  test:
    desc: Run the workspace test suite
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo test --workspace {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  # Formats all Rust source files in place.
  fmt:
    desc: Format all code with rustfmt
    aliases: [format]
    preconditions:
      - sh: rustup component list --installed 2>/dev/null | grep -q rustfmt || command -v rustfmt
        msg: "rustfmt not found — rustup component add rustfmt"
    cmds:
      - cargo fmt --all

  # Checks formatting without modifying files. Used in CI.
  fmt:check:
    desc: Check formatting without writing changes
    cmds:
      - cargo fmt --all -- --check

  # Runs Clippy with `-D warnings` so any lint is a hard failure.
  lint:
    desc: Run clippy (read-only, deny warnings)
    preconditions:
      - sh: rustup component list --installed 2>/dev/null | grep -q clippy || command -v cargo-clippy
        msg: "clippy not found — rustup component add clippy"
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  # Applies Clippy's auto-fixable suggestions. Works on dirty/staged trees.
  lint:fix:
    desc: Run clippy with automatic fixes
    aliases: [fix]
    cmds:
      - cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings

  # Runs criterion benchmarks. Pass a filter via CLI_ARGS to target specific benches.
  bench:
    desc: Run benchmarks
    cmds:
      - cargo bench --workspace {{.CLI_ARGS}}

  # Builds rustdoc for all crates, excluding their dependencies.
  docs:
    desc: Build crate documentation
    cmds:
      - cargo doc --workspace --no-deps {{.CLI_ARGS}}

  # Builds rustdoc and opens it in the default browser.
  docs:open:
    desc: Build and open crate documentation
    cmds:
      - cargo doc --workspace --no-deps --open

  # Runs fmt:check, lint, and cargo check in sequence. Use before committing.
  check:
    desc: Static checks — fmt, clippy, cargo check
    cmds:
      - task: fmt:check
      - task: lint
      - cargo check --workspace --all-targets

  # Full pre-merge gate: static checks followed by the full test suite.
  ci:
    desc: Full CI sequence (check + test)
    cmds:
      - task: check
      - task: test

  # Deletes the `target/` directory. Skipped automatically if `target/` does not exist.
  clean:
    desc: Remove Cargo build output
    status:
      - test ! -d target
    cmds:
      - cargo clean

  # Removes the `.glyphtrail/` index. Prompts for confirmation before deleting.
  clean:index:
    desc: Remove the local .glyphtrail index directory
    prompt: "Delete .glyphtrail/ (local graph index)?"
    cmds:
      - rm -rf .glyphtrail

  # Removes the generated `graph.html` visualization file.
  clean:viz:
    desc: Remove generated graph.html
    cmds:
      - rm -f graph.html
