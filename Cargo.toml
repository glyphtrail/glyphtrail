[workspace]
resolver = "2"
members = [
    "crates/glyphtrail-core",
    "crates/glyphtrail-parse",
    "crates/glyphtrail-store",
    "crates/glyphtrail-forge-id",
    "crates/glyphtrail-analyze",
    "crates/glyphtrail-viz",
    "crates/glyphtrail-server",
    "crates/glyphtrail-mcp",
    "crates/glyphtrail-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "EUPL-1.2"
rust-version = "1.95"
repository = "https://github.com/glyphtrail/glyphtrail"
homepage = "https://glyphtrail.dev"

# Inter-crate deps carry both `path` (used in this workspace) and `version`
# (required by `cargo publish`; crates.io drops the path and resolves the
# version). Keep the version in lockstep with `workspace.package.version`.
[workspace.dependencies]
glyphtrail-core = { path = "crates/glyphtrail-core", version = "0.2.0" }
glyphtrail-parse = { path = "crates/glyphtrail-parse", version = "0.2.0" }
glyphtrail-store = { path = "crates/glyphtrail-store", version = "0.2.0" }
glyphtrail-forge-id = { path = "crates/glyphtrail-forge-id", version = "0.2.0" }
glyphtrail-analyze = { path = "crates/glyphtrail-analyze", version = "0.2.0" }
glyphtrail-viz = { path = "crates/glyphtrail-viz", version = "0.2.0" }
glyphtrail-server = { path = "crates/glyphtrail-server", version = "0.2.0" }
glyphtrail-mcp = { path = "crates/glyphtrail-mcp", version = "0.2.0" }

uuid = { version = "1", features = ["v5"] }
ureq = { version = "3", features = ["json"] }
detect-coding-agent = "0"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "1.1"
assert2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.8"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tree-sitter = "0.26"
tree-sitter-loader = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tree-sitter-bash = "0.25"
tree-sitter-php = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-ocaml = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-elixir = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1.2"

[profile.release]
lto = "thin"

# Always build the LadybugDB native dependency (`lbug`) optimized, regardless of
# glyphtrail's own profile. Its C++ core is unusably slow unoptimized, and a debug
# build of glyphtrail shouldn't pay to compile a debug `lbug`. The `opt-level`
# also makes the `cmake` build script select CMAKE_BUILD_TYPE=Release.
[profile.dev.package.lbug]
opt-level = 3
debug = false

[profile.test.package.lbug]
opt-level = 3
debug = false
