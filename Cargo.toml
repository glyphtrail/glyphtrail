[workspace]
resolver = "2"
members = [
    "crates/meridian-core",
    "crates/meridian-parse",
    "crates/meridian-store",
    "crates/meridian-viz",
    "crates/meridian-server",
    "crates/meridian-mcp",
    "crates/meridian-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "EUPL-1.2"
rust-version = "1.95"
repository = "https://github.com/sunsided/meridian"

[workspace.dependencies]
meridian-core = { path = "crates/meridian-core" }
meridian-parse = { path = "crates/meridian-parse" }
meridian-store = { path = "crates/meridian-store" }
meridian-viz = { path = "crates/meridian-viz" }
meridian-server = { path = "crates/meridian-server" }
meridian-mcp = { path = "crates/meridian-mcp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "1.1"
assert2 = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.8"
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

tree-sitter = "0.26"
tree-sitter-loader = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
tree-sitter-bash = "0.23"
tree-sitter-php = "0.23"
tree-sitter-scala = "0.23"
tree-sitter-ocaml = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-elixir = "0.3"
tree-sitter-swift = "0.7"

[profile.release]
lto = "thin"

# Always build the LadybugDB native dependency (`lbug`) optimized, regardless of
# meridian's own profile. Its C++ core is unusably slow unoptimized, and a debug
# build of meridian shouldn't pay to compile a debug `lbug`. The `opt-level`
# also makes the `cmake` build script select CMAKE_BUILD_TYPE=Release.
[profile.dev.package.lbug]
opt-level = 3
debug = false

[profile.test.package.lbug]
opt-level = 3
debug = false
