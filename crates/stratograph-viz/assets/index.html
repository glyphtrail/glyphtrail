<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>stratograph</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: ui-monospace, monospace; }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; min-height: 44px; z-index: 10;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 6px 12px;
    background: #1b1f24; color: #e6e6e6; border-bottom: 1px solid #333;
  }
  #toolbar input[type=text] { background: #0d1117; color: #e6e6e6; border: 1px solid #444;
    padding: 5px 8px; border-radius: 4px; width: 200px; }
  #toolbar select { background: #0d1117; color: #e6e6e6; border: 1px solid #444;
    padding: 5px 8px; border-radius: 4px; }
  #toolbar label { font-size: 12px; opacity: 0.85; }
  .group { display: flex; align-items: center; gap: 6px; padding: 2px 6px;
    border: 1px solid #333; border-radius: 6px; }
  .group > span { font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: .04em; }
  .group label { white-space: nowrap; }
  #cy { position: absolute; top: 84px; bottom: 0; left: 0; right: 0; background: #0d1117; }
  #info {
    position: fixed; right: 0; top: 84px; width: 320px; bottom: 0; overflow: auto;
    background: #161b22; color: #c9d1d9; border-left: 1px solid #333;
    padding: 12px; font-size: 13px; display: none;
  }
  #info h3 { margin: 0 0 6px; font-size: 14px; }
  #info pre { white-space: pre-wrap; background: #0d1117; padding: 8px; border-radius: 4px; }
  #info button { background: #21262d; color: #c9d1d9; border: 1px solid #444;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; margin: 6px 0; }
  #info button:hover { background: #30363d; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #30363d; }
  #summary {
    position: fixed; left: 0; top: 84px; width: 270px; bottom: 0; overflow: auto;
    background: #161b22; color: #c9d1d9; border-right: 1px solid #333;
    padding: 12px; font-size: 12px; display: none;
  }
  #summary h3 { margin: 0 0 8px; font-size: 14px; }
  #summary .row { margin: 2px 0; }
  #summary .num { color: #f0c674; font-weight: bold; }
  #status { font-size: 12px; opacity: 0.7; }
  #results {
    position: fixed; top: 84px; left: 12px; width: 340px; max-height: 55vh; overflow: auto;
    background: #161b22; border: 1px solid #333; border-radius: 6px; z-index: 11; display: none;
  }
  #results .r { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #21262d;
    color: #c9d1d9; font-size: 12px; }
  #results .r:last-child { border-bottom: none; }
  #results .r:hover { background: #21262d; }
  #results .r small { opacity: 0.6; }
  #legend {
    position: fixed; left: 12px; bottom: 12px; z-index: 9; max-width: 220px;
    background: rgba(22, 27, 34, 0.92); color: #c9d1d9; border: 1px solid #333;
    border-radius: 6px; padding: 6px 9px; font-size: 11px;
  }
  #legend h4 { margin: 0; font-size: 11px; opacity: 0.7; cursor: pointer; user-select: none; }
  #legend .items { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 6px; }
  #legend .it { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div id="toolbar">
  <strong>stratograph</strong>
  <input id="filter" type="text" placeholder="search symbols…" />
  <select id="protoFilter" title="isolate an API protocol">
    <option value="">all protocols</option>
    <option value="rest">REST</option>
    <option value="grpc">gRPC</option>
    <option value="graphql">GraphQL</option>
  </select>
  <span class="group" id="nodeGroups"><span>nodes</span></span>
  <span class="group" id="edgeGroups"><span>edges</span></span>
  <span id="status"></span>
</div>
<div id="results"></div>
<div id="cy"></div>
<div id="legend"></div>
<div id="summary"></div>
<div id="info"></div>
<script>
const KIND_COLOR = {
  repo: "#f0c674", directory: "#b294bb", file: "#81a2be",
  module: "#8abeb7", function: "#b5bd68", method: "#8abeb7",
  class: "#de935f", struct: "#de935f", interface: "#cc6666",
  enum: "#cc6666", trait: "#cc6666", comment: "#969896",
  endpoint: "#56b6c2", client_call: "#e5c07b",
};
const EDGE_COLOR = {
  contains: "#3a3f44", calls: "#b5bd68", imports: "#81a2be",
  extends: "#de935f", implements: "#cc6666", documents: "#969896",
  defines: "#3a3f44", references: "#666",
  handles: "#56b6c2", mounts: "#abb2bf", invokes: "#e5c07b", exposes: "#c678dd",
};
// Cross-boundary (API) edges render dashed and, where a protocol is known,
// colored per protocol rather than by edge kind.
const CROSS_BOUNDARY = new Set(["invokes", "exposes", "handles", "mounts"]);
const PROTOCOL_COLOR = { rest: "#56b6c2", grpc: "#c678dd", graphql: "#e06c75" };

// Toolbar groups bundle related kinds behind one checkbox. Each maps to the
// concrete NodeKind/EdgeKind::as_str() values the server filters on (#194).
const NODE_GROUPS = {
  functions: ["function", "method"],
  types: ["class", "struct", "enum", "trait", "interface"],
  modules: ["module"],
  files: ["file", "directory", "repo"],
  api: ["endpoint", "client_call"],
  comments: ["comment"],
};
const EDGE_GROUPS = {
  calls: ["calls"],
  containment: ["contains", "defines"],
  imports: ["imports"],
  inheritance: ["extends", "implements"],
  "api links": ["invokes", "exposes", "handles", "mounts"],
  docs: ["documents", "references"],
};
// Heavy/noisy groups start off so the initial view is a readable structural
// overview; toggle them on (or click-expand a node) to drill in.
const NODE_OFF = new Set(["functions", "comments"]);
const EDGE_OFF = new Set(["calls"]);
const NODE_LIMIT = 2000;

// Static mode = data inlined by `stratograph viz`; serve mode fetches from the
// server and supports re-querying + click-to-expand.
const STATIC = !!window.STRATOGRAPH_DATA;

// The protocol an edge belongs to, taken from whichever endpoint it touches.
function edgeProtocol(e) {
  return e.source().data("protocol") || e.target().data("protocol") || null;
}
function edgeColor(e) {
  const k = e.data("kind");
  if (CROSS_BOUNDARY.has(k)) {
    const p = edgeProtocol(e);
    return (p && PROTOCOL_COLOR[p]) || EDGE_COLOR[k] || "#999";
  }
  return EDGE_COLOR[k] || "#555";
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Build the group-toggle checkboxes and return a `getSelected()` accessor.
function buildToggles(containerId, groups, offSet, onChange) {
  const host = document.getElementById(containerId);
  const boxes = {};
  for (const name of Object.keys(groups)) {
    const id = containerId + "-" + name.replace(/\s+/g, "_");
    const lbl = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = id; cb.checked = !offSet.has(name);
    cb.addEventListener("change", onChange);
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(" " + name));
    host.appendChild(lbl);
    boxes[name] = cb;
  }
  return {
    // The concrete kinds the server filters on, from the checked groups.
    kinds: () => Object.entries(groups)
      .filter(([name]) => boxes[name].checked)
      .flatMap(([, kinds]) => kinds),
    // Group names currently unchecked, for persisting the selection.
    offGroups: () => Object.keys(groups).filter((name) => !boxes[name].checked),
  };
}

function setStatus(cy, note) {
  document.getElementById("status").textContent =
    cy.nodes().length + " nodes, " + cy.edges().length + " edges" + (note ? " · " + note : "");
}

// Color key for the node kinds currently in the graph (collapsible).
let legendOpen = true;
function updateLegend() {
  const kinds = [...new Set(cy.nodes().map((n) => n.data("kind")))].sort();
  const legend = document.getElementById("legend");
  if (!kinds.length) { legend.style.display = "none"; return; }
  legend.style.display = "block";
  const items = kinds.map((k) =>
    "<span class='it'><span class='dot' style='background:" + (KIND_COLOR[k] || "#888") +
    "'></span>" + esc(k) + "</span>").join("");
  legend.innerHTML = "<h4 id='legendToggle'>legend " + (legendOpen ? "▾" : "▸") + "</h4>" +
    "<div class='items' style='display:" + (legendOpen ? "flex" : "none") + "'>" + items + "</div>";
  document.getElementById("legendToggle").addEventListener("click", () => {
    legendOpen = !legendOpen;
    updateLegend();
  });
}

// While a fetch + relayout is in flight the toolbar is disabled, so rapid
// toggling can't queue up several blocking rebuilds (#194 follow-up).
let busy = false;
function setBusy(on) {
  busy = on;
  document.querySelectorAll("#toolbar input, #toolbar select")
    .forEach((el) => { el.disabled = on; });
  document.getElementById("toolbar").style.opacity = on ? "0.55" : "1";
}

// Animated cose runs the physics over animation frames instead of one blocking
// pass, so the graph visibly settles into place and the UI stays responsive
// (the old `animate:false` froze the tab for seconds on a few hundred nodes).
// `done` fires once the layout stops.
function runLayout(cy, done) {
  const layout = cy.layout({
    name: "cose", animate: true, refresh: 12, numIter: 1000,
    nodeRepulsion: 8000, idealEdgeLength: 60, randomize: false, fit: true,
  });
  if (done) layout.one("layoutstop", done);
  layout.run();
}

const CY_STYLE = [
  { selector: "node", style: {
    "background-color": (e) => KIND_COLOR[e.data("kind")] || "#888",
    "label": "data(label)", "color": "#ddd", "font-size": 9,
    "text-valign": "bottom", "text-wrap": "ellipsis", "text-max-width": 90,
    // Size by connectivity so hubs (heavily-referenced symbols) stand out.
    "width": (e) => 12 + Math.min(20, e.degree(false) * 1.4),
    "height": (e) => 12 + Math.min(20, e.degree(false) * 1.4) } },
  { selector: "edge", style: {
    "width": (e) => CROSS_BOUNDARY.has(e.data("kind")) ? 2 : 1,
    "line-color": edgeColor,
    "target-arrow-color": edgeColor,
    "target-arrow-shape": "triangle", "arrow-scale": 0.7,
    "curve-style": "bezier",
    "line-style": (e) => CROSS_BOUNDARY.has(e.data("kind")) || e.data("confidence") === "inferred" ? "dashed" : "solid" } },
  { selector: ".faded", style: { "opacity": 0.08 } },
  { selector: "node[?seed]", style: {
    "background-color": "#f0c674", "border-width": 4, "border-color": "#fff",
    "width": 22, "height": 22 } },
  { selector: 'node[impact_conf = "inferred"]', style: {
    "border-width": 2, "border-color": "#e5c07b", "border-style": "dashed" } },
  { selector: "node[?impact_cross]", style: {
    "border-width": 3, "border-color": "#e5c07b", "border-style": "solid" } },
  { selector: ":selected", style: { "border-width": 3, "border-color": "#fff" } },
];

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [],
  style: CY_STYLE,
  layout: { name: "preset" },
});

let getNodeKinds, getEdgeKinds;

// Fetch a fresh graph from the server for the current toggle selection.
async function reload() {
  if (busy) return;
  const kinds = getNodeKinds().join(",");
  const edges = getEdgeKinds().join(",");
  // No node kinds selected -> an empty graph; skip the fetch entirely (an empty
  // `kinds=` must not be read by the server as "no filter, send everything").
  if (!kinds) {
    cy.elements().remove();
    updateLegend();
    setStatus(cy, "no node kinds selected");
    return;
  }
  setBusy(true);
  setStatus(cy, "loading…");
  const url = `/api/graph?kinds=${encodeURIComponent(kinds)}&edges=${encodeURIComponent(edges)}&limit=${NODE_LIMIT}`;
  let data;
  try {
    data = await (await fetch(url)).json();
  } catch (_) {
    setBusy(false);
    setStatus(cy, "load failed");
    return;
  }
  cy.elements().remove();
  cy.add(data);
  updateLegend();
  setStatus(cy, "building…");
  runLayout(cy, () => { setBusy(false); setStatus(cy, null); });
}

// Static mode: all data is present; toggles show/hide by kind client-side.
function applyStaticFilter() {
  const nodeKinds = new Set(getNodeKinds());
  const edgeKinds = new Set(getEdgeKinds());
  cy.nodes().forEach((n) => n.style("display", nodeKinds.has(n.data("kind")) ? "element" : "none"));
  cy.edges().forEach((e) => e.style("display",
    edgeKinds.has(e.data("kind")) && e.source().visible() && e.target().visible() ? "element" : "none"));
  setStatus(cy, "showing " + cy.nodes(":visible").length + " of " + cy.nodes().length + " nodes");
}

// Click-to-expand: pull a node's neighbours from the server and merge them in.
async function expand(id) {
  if (busy) return;
  setBusy(true);
  setStatus(cy, "expanding…");
  let data;
  try {
    data = await (await fetch("/api/neighbors?id=" + encodeURIComponent(id))).json();
  } catch (_) {
    setBusy(false);
    setStatus(cy, "expand failed");
    return;
  }
  const fresh = data.filter((el) => !cy.getElementById(el.data.id).length);
  if (fresh.length) {
    cy.add(fresh);
    updateLegend();
    runLayout(cy, () => { setBusy(false); setStatus(cy, "expanded +" + fresh.length); });
  } else {
    setBusy(false);
    setStatus(cy, "no new neighbours");
  }
}

// Persist the toggle selection across reloads (serve mode only); a static
// export is a fixed curated subgraph, so it always shows every kind it contains.
const STORE_KEY = "stratograph-view-v1";
let nodeT, edgeT;
function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (_) { return null; }
}
function saveState() {
  if (STATIC || !nodeT) return;
  try {
    localStorage.setItem(STORE_KEY,
      JSON.stringify({ nodeOff: nodeT.offGroups(), edgeOff: edgeT.offGroups() }));
  } catch (_) {}
}
const saved = STATIC ? null : loadSaved();
const nodeOff = STATIC ? new Set() : new Set(saved?.nodeOff ?? [...NODE_OFF]);
const edgeOff = STATIC ? new Set() : new Set(saved?.edgeOff ?? [...EDGE_OFF]);
const onToggle = STATIC ? applyStaticFilter : reload;
const onChange = () => { saveState(); onToggle(); };
nodeT = buildToggles("nodeGroups", NODE_GROUPS, nodeOff, onChange);
edgeT = buildToggles("edgeGroups", EDGE_GROUPS, edgeOff, onChange);
getNodeKinds = nodeT.kinds;
getEdgeKinds = edgeT.kinds;

// Initial render.
if (STATIC) {
  cy.add(window.STRATOGRAPH_DATA);
  applyStaticFilter();
  updateLegend();
  runLayout(cy);
} else {
  reload();
}

// Impact mode: render the blast-radius summary panel.
const IMPACT = window.STRATOGRAPH_IMPACT || null;
if (IMPACT) {
  const s = IMPACT.summary;
  const panel = document.getElementById("summary");
  panel.style.display = "block";
  panel.innerHTML =
    "<h3>impact</h3>" +
    "<p>" + esc(IMPACT.headline) + "</p>" +
    "<div class='row'><span class='num'>" + s.total + "</span> impacted symbols</div>" +
    "<div class='row'><span class='num'>" + s.tests + "</span> tests</div>" +
    "<div class='row'><span class='num'>" + s.api + "</span> API surface</div>" +
    "<div class='row'><span class='num'>" + s.cross_boundary + "</span> cross-boundary consumers</div>" +
    "<div class='row'><span class='num'>" + s.entrypoints + "</span> entrypoints</div>" +
    "<div class='row'>max distance " + s.max_distance + "</div>" +
    "<p style='margin-top:10px;opacity:.7'>gold = seed · dashed ring = inferred · solid ring = cross-boundary</p>";
}

// Impact details for a tapped node (class, distance, confidence, edge path).
function impactDetail(d) {
  if (!IMPACT || d.impact_distance == null && !d.seed) return "";
  if (d.seed) return "<p><span class='tag'>seed</span></p>";
  const path = (d.impact_path || []).join(" → ");
  return "<p><span class='tag'>" + esc(d.impact_class) + "</span> " +
    "distance " + esc(d.impact_distance) + ", " + esc(d.impact_conf) + "</p>" +
    (path ? "<p><small>path: " + esc(path) + "</small></p>" : "");
}

const nodeTitle = (d) =>
  d.protocol ? ((d.method ? d.method + " " : "") + (d.path || d.label)) : (d.qualified_name || d.label);

// Cross-boundary links of `n`, grouped for the detail panel.
function apiLinks(n) {
  let h = "";
  const rows = [];
  n.connectedEdges().forEach((e) => {
    const k = e.data("kind");
    if (!CROSS_BOUNDARY.has(k)) return;
    const outgoing = e.source().id() === n.id();
    const other = outgoing ? e.target() : e.source();
    const od = other.data();
    rows.push({
      kind: k, dir: outgoing ? "→" : "←",
      label: (od.method ? od.method + " " : "") + (od.path || od.qualified_name || od.label),
      loc: (od.file || "") + (od.line ? ":" + od.line : ""),
      conf: e.data("confidence"),
    });
  });
  if (rows.length) {
    h += "<h3>links</h3>";
    rows.forEach((r) => {
      h += "<p><span class='tag'>" + esc(r.kind) + " " + r.dir + "</span> " +
        esc(r.label) + " <small>(" + esc(r.loc) + ", " + esc(r.conf) + ")</small></p>";
    });
  }
  return h;
}

// Render the detail panel for a node and wire its expand button.
function openDetail(n) {
  const d = n.data();
  const info = document.getElementById("info");
  info.style.display = "block";
  info.innerHTML = "<h3>" + esc(nodeTitle(d)) + "</h3>" +
    "<span class='tag'>" + esc(d.kind) + "</span> " +
    (d.protocol ? "<span class='tag'>" + esc(d.protocol) + "</span> " : "") +
    (d.language ? "<span class='tag'>" + esc(d.language) + "</span>" : "") +
    "<p>" + esc(d.file || "") + (d.line ? ":" + esc(d.line) : "") + "</p>" +
    impactDetail(d) +
    (STATIC ? "" : "<button id='expandBtn'>+ expand neighbours</button>") +
    (d.protocol ? apiLinks(n) : "") +
    (d.doc ? "<pre>" + esc(d.doc) + "</pre>" : "");
  const btn = document.getElementById("expandBtn");
  if (btn) btn.addEventListener("click", () => expand(d.id));
}

// Center and isolate `n`, fading the rest — shared by tap and search-to-seed.
function focusNode(n) {
  cy.$(":selected").unselect();
  n.select();
  cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
  cy.elements().addClass("faded");
  n.removeClass("faded");
  n.neighborhood().removeClass("faded");
}

cy.on("tap", "node", (evt) => {
  const n = evt.target;
  openDetail(n);
  cy.elements().addClass("faded");
  n.removeClass("faded");
  n.neighborhood().removeClass("faded");
});
cy.on("tap", (evt) => { if (evt.target === cy) {
  cy.elements().removeClass("faded");
  document.getElementById("info").style.display = "none";
}});

const filterEl = document.getElementById("filter");
const resultsEl = document.getElementById("results");
const hideResults = () => { resultsEl.style.display = "none"; resultsEl.innerHTML = ""; };

// Load a searched node (and its neighbours) into the graph, then center on it —
// the "start from a symbol" entry point that complements the structural view.
async function seedNode(id) {
  await expand(id);
  const n = cy.getElementById(id);
  if (n.length) { focusNode(n); openDetail(n); }
}

// Server full-text search over the whole index (not just the loaded subgraph),
// shown as a clickable dropdown of results.
async function doSearch(q) {
  let list;
  try {
    list = await (await fetch("/api/search?q=" + encodeURIComponent(q) + "&limit=12")).json();
  } catch (_) { return; }
  if (!Array.isArray(list) || !list.length) {
    resultsEl.innerHTML = "<div class='r'><small>no matches</small></div>";
    resultsEl.style.display = "block";
    return;
  }
  resultsEl.innerHTML = list.map((n) =>
    "<div class='r' data-id='" + esc(n.id) + "'>" + esc(n.name) +
    " <small>" + esc(n.kind) + " · " + esc(n.file || "") +
    (n.span ? ":" + esc(n.span.start_line) : "") + "</small></div>").join("");
  resultsEl.style.display = "block";
  resultsEl.querySelectorAll(".r[data-id]").forEach((el) =>
    el.addEventListener("click", () => { hideResults(); seedNode(el.getAttribute("data-id")); }));
}

let searchTimer;
filterEl.addEventListener("input", (e) => {
  const q = e.target.value.trim();
  if (STATIC) {
    // No server: fall back to fading matches in the loaded graph.
    const lq = q.toLowerCase();
    if (!lq) { cy.elements().removeClass("faded"); return; }
    cy.elements().addClass("faded");
    const hit = cy.nodes().filter((n) =>
      (n.data("label") || "").toLowerCase().includes(lq) ||
      (n.data("qualified_name") || "").toLowerCase().includes(lq));
    hit.removeClass("faded");
    hit.neighborhood().removeClass("faded");
    return;
  }
  clearTimeout(searchTimer);
  if (q.length < 2) { hideResults(); return; }
  searchTimer = setTimeout(() => doSearch(q), 200);
});
document.addEventListener("click", (e) => {
  if (e.target !== filterEl && !resultsEl.contains(e.target)) hideResults();
});

document.getElementById("protoFilter").addEventListener("change", (e) => {
  const p = e.target.value;
  if (!p) { cy.elements().removeClass("faded"); return; }
  cy.elements().addClass("faded");
  const api = cy.nodes().filter((n) => n.data("protocol") === p);
  api.removeClass("faded");
  const inc = api.connectedEdges();
  inc.removeClass("faded");
  inc.connectedNodes().removeClass("faded");
});
</script>
</body>
</html>
