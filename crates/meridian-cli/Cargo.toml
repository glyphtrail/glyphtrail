[package]
name = "meridian-cli"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "meridian"
path = "src/main.rs"

[dependencies]
meridian-core.workspace = true
meridian-parse.workspace = true
meridian-store.workspace = true
meridian-viz.workspace = true
meridian-server.workspace = true
meridian-mcp.workspace = true
clap.workspace = true
clap_complete.workspace = true
ignore.workspace = true
blake3.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
ureq = { version = "2", features = ["json"] }
indicatif = "0.17"
globset = "0.4"

[features]
# LadybugDB is the default backend (more capable: Cypher + native graph
# traversal). Opt out of the C++/cmake build with `--no-default-features`
# (then use `--backend sqlite`).
default = ["ladybug"]
# LadybugDB backend + `cypher` subcommand (pulls the lbug C++ build).
ladybug = ["meridian-store/ladybug"]

[dev-dependencies]
assert2.workspace = true
