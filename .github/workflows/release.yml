name: release

# On a version tag, build cross-platform `glyphtrail` binaries and, once every
# target has built, create the GitHub Release (notes generated from the merged
# PRs) with all archives and MCP bundles attached. A failed target means no
# release at all rather than a partial one. Publishing to crates.io is
# intentionally left manual.
on:
  push:
    tags: ["v*"]
  # Manual runs build and package every target (artifacts only) without
  # creating a release: use it to test release changes from a branch.
  workflow_dispatch:

# Least privilege by default; only the final release job can write.
permissions: {}

# Never run two releases for the same tag side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to release a tag that disagrees with the workspace version, so a
  # mistyped tag can't ship binaries that report a different `--version`.
  verify-tag:
    name: Verify tag matches workspace version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare tag and Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: verify-tag
    # Run when verify-tag passed, or was skipped on a manual run.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # Template values reach the scripts as environment variables, never inlined
    # into the shell source.
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # LadybugDB (default feature) links `lbug`. macOS/Windows use the prebuilt
      # liblbug. Linux builds it from source with the runner's compiler: the
      # prebuilt was compiled with an older GCC and segfaults when linked next to
      # a newer libstdc++ (see rust.yml). The flag goes through $GITHUB_ENV, not a
      # matrix-wide `env:`, because lbug's build script only checks whether
      # LBUG_BUILD_FROM_SOURCE is set at all.
      #
      # Release builds deliberately use no cache (neither rust-cache nor
      # sccache): a cache entry written by any branch could otherwise be restored
      # into the shipped binaries.
      - name: Install LadybugDB build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake clang build-essential pkg-config libssl-dev
          echo "LBUG_BUILD_FROM_SOURCE=1" >> "$GITHUB_ENV"
      # lbug (>= 0.21) links OpenSSL. macOS and Windows have no system OpenSSL,
      # so link it statically there: otherwise the binary depends on whatever
      # the runner happened to have (on macOS, Homebrew's dylibs under
      # /opt/homebrew) and fails to start on users' machines. lbug's build
      # script honours OPENSSL_DIR (expects <dir>/lib), so point it at a
      # directory holding only the static libraries. Linux keeps linking the
      # distro's libssl dynamically.
      - name: Provide static OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          src="$(brew --prefix openssl@3)/lib"
          dir="$RUNNER_TEMP/openssl-static"
          mkdir -p "$dir/lib"
          cp "$src/libssl.a" "$src/libcrypto.a" "$dir/lib/"
          echo "OPENSSL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Provide static OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
      # Embed an SBOM (the exact dependency tree) into the binary so it can be
      # audited after the fact with `cargo audit bin <binary>` (#301). Installed
      # from a prebuilt to avoid compiling it on every target.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-auditable
      - name: Build (SBOM embedded)
        shell: bash
        run: cargo auditable build --release --locked -p glyphtrail-cli --target "$TARGET"
      # Guard against shipping a binary that only runs on the build machine:
      # nothing may be loaded from Homebrew (or another /usr/local prefix).
      - name: Check dynamic dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L "target/$TARGET/release/glyphtrail"
          if otool -L "target/$TARGET/release/glyphtrail" | tail -n +2 | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::binary links libraries outside the macOS base system"
            exit 1
          fi
      - name: Smoke test
        shell: bash
        run: |
          bin="target/$TARGET/release/glyphtrail"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
      # Archive + MCP bundle (.mcpb) into dist/; shared with the musl job.
      - name: Package
        shell: bash
        run: .github/scripts/package.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Fully static Linux binary (no glibc / libssl version requirements), built
  # natively in an Alpine container. Separate from the matrix because nearly
  # every step differs. Notes on the flags:
  # - RUSTFLAGS replaces the repo's Linux `--export-dynamic` link flag (see
  #   .cargo/config.toml), which breaks a static-pie binary. A static binary
  #   cannot dlopen lbug extensions anyway, so the `vector` extension is
  #   unavailable in this build.
  # - lbug requests OpenSSL as a dylib, which rustc places after libc; with the
  #   static OpenSSL archives that leaves libc symbols unresolved, so libc is
  #   linked once more at the very end (`-lc`).
  # - `--target` keeps those flags off build scripts and proc-macros, which
  #   must stay dynamic.
  build-musl:
    name: x86_64-unknown-linux-musl
    needs: verify-tag
    # Run when verify-tag passed, or was skipped on a manual run.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read # check out the repository
    container:
      image: rust:1.99-alpine@sha256:b1d5dd5a22a09404d3e798c0cf051b689077360374eb505fa5bb93c479693d87
    env:
      TARGET: x86_64-unknown-linux-musl
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
      LBUG_BUILD_FROM_SOURCE: "1"
      CC: gcc
      CXX: g++
      OPENSSL_DIR: /opt/openssl-static
      RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-lc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          apk add --no-cache bash build-base cmake jq linux-headers openssl-dev \
            openssl-libs-static perl pkgconf python3 zip
          mkdir -p "$OPENSSL_DIR/lib"
          cp /usr/lib/libssl.a /usr/lib/libcrypto.a "$OPENSSL_DIR/lib/"
      # Built for the host, so it must not get the job's static-target
      # RUSTFLAGS (proc-macros can't be built with crt-static). Empty, not
      # unset, so the repo's --export-dynamic is overridden as well.
      - name: Install cargo-auditable
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-auditable --locked --version 0.7.7
      - name: Build (SBOM embedded)
        run: cargo auditable build --release --locked -p glyphtrail-cli --target "$TARGET"
      - name: Check the binary is static
        run: |
          bin="target/$TARGET/release/glyphtrail"
          if readelf -d "$bin" | grep -q NEEDED; then
            readelf -d "$bin" | grep NEEDED
            echo "::error::musl binary has dynamic library dependencies"
            exit 1
          fi
          "$bin" --version
      - name: Package
        shell: bash
        run: .github/scripts/package.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build, build-musl]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      # Tags with a pre-release suffix (v1.2.0-rc.1) become pre-releases. If the
      # release already exists (e.g. drafted by hand, or a re-run), only its
      # assets are replaced; the notes are left alone.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              "${prerelease[@]}"
          fi
