name: release

# Build cross-platform `glyphtrail` binaries on a version tag and attach them to
# the GitHub Release. Publishing to crates.io is intentionally left manual.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # LadybugDB (default feature) links `lbug`, which builds from C++ via
      # cmake/clang if no prebuilt archive matches the target. Linux runners
      # need the toolchain; macOS/Windows runners ship cmake.
      - name: Install LadybugDB build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Embed an SBOM (the exact dependency tree) into the binary so it can be
      # audited after the fact with `cargo audit bin <binary>` (#301). Installed
      # from a prebuilt to avoid compiling it on every target.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      - name: Build (SBOM embedded)
        run: cargo auditable build --release --locked -p glyphtrail-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          staging="glyphtrail-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$staging"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/glyphtrail.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/glyphtrail" "$staging/"
          fi
          cp README.md LICENSE-EUPL-1.2 "$staging/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$staging.zip" "$staging" >/dev/null
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
