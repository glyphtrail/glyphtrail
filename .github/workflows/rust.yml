name: ci build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, 1.95.0]

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      # LadybugDB is the sole storage backend (a required dependency), so every
      # build links `lbug` (a prebuilt liblbug, or a cmake/clang source build as
      # fallback) and needs the C++ toolchain.
      - name: Install LadybugDB build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      # Build before Clippy so the `lbug` native static library is produced and
      # discoverable: Clippy links it, but only a build (its build script) emits
      # the lib + link-search path. On a warm cache the prior lib was restored so
      # Clippy-first happened to work; a cold cache (e.g. after a Cargo.lock
      # change) has no lib yet, so Clippy fails to link until a build runs first.
      - name: Build
        run: cargo build --workspace --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --verbose

  dependencies:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-sbom
        uses: psastras/sbom-rs/actions/install-cargo-sbom@cargo-sbom-v0.10.0

      - name: Generate SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 > sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

      - name: Submit dependencies to GitHub
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: sbom.json
