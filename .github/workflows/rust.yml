name: ci build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more ask for it explicitly.
permissions: {}

# Supersede in-flight PR runs on a new push; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    strategy:
      matrix:
        toolchain: [stable, 1.95.0]
    # LadybugDB is the sole storage backend (a required dependency), so every
    # build links `lbug`. On Linux we build it from source instead of using the
    # prebuilt liblbug: the prebuilt was compiled with an older GCC, and linking
    # it next to code built with a newer libstdc++ (e.g. Ubuntu 26.04's GCC 15)
    # merges mismatched `std::format` template instances and segfaults at
    # runtime. A source build compiles everything with one compiler.
    #
    # The C++ build is slow, so it is cached at two levels: rust-cache restores
    # the whole lbug build output while Cargo.lock and the toolchain are
    # unchanged, and sccache (CMake compiler launcher, GitHub Actions cache
    # backend) serves the individual C++ objects when rust-cache misses, e.g.
    # after a Dependabot lockfile bump.
    env:
      LBUG_BUILD_FROM_SOURCE: "1"
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Install LadybugDB build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential pkg-config libssl-dev
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.18.0"
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all --check
      # Build before Clippy so the `lbug` native static library is produced and
      # discoverable: Clippy links it, but only a build (its build script) emits
      # the lib + link-search path. On a warm cache the prior lib was restored so
      # Clippy-first happened to work; a cold cache (e.g. after a Cargo.lock
      # change) has no lib yet, so Clippy fails to link until a build runs first.
      - name: Build
        run: cargo build --workspace --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --verbose
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  dependencies:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # submit the dependency snapshot to the dependency graph
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-sbom
        uses: psastras/sbom-rs/actions/install-cargo-sbom@9ecc460b937ac5558c4f8ebebc9e07d2bdbef67b # cargo-sbom-v0.10.0

      - name: Generate SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 > sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

      - name: Submit dependencies to GitHub
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: sbom.json
