name: Label PRs
on:
  pull_request_target:
    branches:
      - main

# pull_request_target runs with the base repo's token, so this workflow must
# never check out or run code from the PR: the labeler only reads the list of
# changed files through the API.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read .github/labeler.yml from the base branch
      pull-requests: write # apply labels
    steps:
      - name: Label PR based on changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ github.token }}"
